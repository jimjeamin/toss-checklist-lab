<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>오늘의 체크리스트 · 미리보기</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:#f7f8fa;color:#191f28;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:20px 22px 28px}.top{display:flex;align-items:center;gap:9px;color:#333d4b;font-size:14px;font-weight:700}.mark{display:grid;place-items:center;width:26px;height:26px;border-radius:9px;background:#3182f6;color:white;font-size:17px}.badge{margin-left:auto;padding:6px 9px;border-radius:999px;background:#e9edf2;color:#687385;font-size:11px}.intro{padding:42px 2px 24px}.eyebrow{margin:0 0 10px;color:#3182f6;font-size:13px;font-weight:700}h1{margin:0;font-size:clamp(30px,8vw,38px);line-height:1.24;letter-spacing:-1.2px}.date{margin:14px 0 0;color:#8b95a1;font-size:14px}.progress{padding:17px 18px;border:1px solid #edf0f3;border-radius:17px;background:white}.progress-copy{display:flex;justify-content:space-between;color:#687385;font-size:13px}.progress-copy strong{color:#333d4b}.track{height:7px;margin-top:13px;overflow:hidden;border-radius:99px;background:#edf1f5}.bar{width:0;height:100%;border-radius:inherit;background:#3182f6;transition:width .18s}.form{display:flex;gap:9px;margin:20px 0 15px}.form input{width:100%;min-width:0;padding:15px 16px;border:1px solid #e5e9ef;border-radius:14px;outline:none;background:white;font:inherit;font-size:14px}.form input:focus{border-color:#7fb0ff;box-shadow:0 0 0 3px #e7f1ff}.form button,.close{min-width:62px;border:0;border-radius:14px;background:#3182f6;color:white;font:inherit;font-weight:700}.share{width:100%;margin:0 0 29px;padding:14px;border:0;border-radius:14px;background:#eaf3ff;color:#2265cf;font:inherit;font-size:14px;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.heading h2{margin:0;font-size:17px}.clear{padding:7px 0 7px 8px;border:0;background:transparent;color:#8b95a1;font-size:12px}.tasks{display:grid;gap:9px;margin:0;padding:0;list-style:none}.task{display:flex;align-items:center;gap:12px;padding:15px 14px;border:1px solid #edf0f3;border-radius:14px;background:white}.task input{width:21px;height:21px;margin:0;accent-color:#3182f6}.task span{flex:1;min-width:0;overflow-wrap:anywhere;color:#333d4b;font-size:14px}.task.done span{color:#a0a8b2;text-decoration:line-through}.delete{padding:5px;border:0;background:transparent;color:#a0a8b2}.empty{padding:27px 0;color:#9aa3ad;text-align:center;font-size:13px;line-height:1.7}.footer{display:flex;align-items:center;gap:8px;margin-top:28px;padding:13px 12px;border-radius:12px;background:#eef1f5;color:#7b8794;font-size:11px;line-height:1.5}.dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:#3182f6}dialog{width:min(calc(100% - 32px),460px);padding:23px;border:0;border-radius:22px;color:#191f28;box-shadow:0 18px 60px #16223533}dialog::backdrop{background:#10182870}.grab{width:34px;height:4px;margin:-8px auto 22px;border-radius:8px;background:#d7dce2}dialog h2{margin:0 0 16px;font-size:20px;line-height:1.4}pre{max-height:40vh;overflow:auto;padding:15px;border-radius:13px;background:#f5f7fa;color:#485465;font:inherit;font-size:13px;line-height:1.65;white-space:pre-wrap}.close{width:100%;margin-top:9px;padding:14px}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><span class="mark">✓</span><span>오늘의 체크리스트</span><span class="badge">로컬 미리보기</span></header>
    <section class="intro"><p class="eyebrow">조금씩 해내는 오늘</p><h1>해야 할 일을<br>가볍게 정리해요</h1><p class="date" id="date"></p></section>
    <section class="progress"><div class="progress-copy"><span>오늘의 완료</span><strong id="count">0 / 0 완료</strong></div><div class="track"><div class="bar" id="bar"></div></div><p id="remaining" style="margin:10px 0 0;color:#8b95a1;font-size:12px">할 일을 추가해 오늘을 시작해요.</p></section>
    <form class="form" id="form"><input id="new-task" maxlength="80" placeholder="새로운 할 일을 입력해요" autocomplete="off" required><button>추가</button></form>
    <button class="share" id="share">↗ 체크리스트 공유하기</button>
    <section><div class="heading"><h2>할 일</h2><button class="clear" id="clear">완료 항목 지우기</button></div><div style="display:flex;gap:7px;margin-bottom:12px" role="group" aria-label="할 일 필터"><button class="filter active" data-filter="all" aria-pressed="true">전체 <span id="all-count">0</span></button><button class="filter" data-filter="active" aria-pressed="false">남은 일 <span id="active-count">0</span></button><button class="filter" data-filter="done" aria-pressed="false">완료 <span id="done-count">0</span></button></div><ul class="tasks" id="tasks"></ul><p class="empty" id="empty">아직 항목이 없어요.<br>오늘 할 일을 하나 추가해볼까요?</p></section>
    <footer class="footer"><span class="dot"></span><span id="status">공유는 모의 SDK 미리보기예요. 실제 토스로 전송되지 않아요.</span></footer>
  </main>
  <dialog id="preview"><div class="grab"></div><p class="eyebrow">공유 미리보기 · 모의 SDK</p><h2>토스 앱 공유 호출을 흉내 내고 있어요</h2><pre id="message"></pre><button class="close" id="close">확인</button></dialog>
  <script>
    const KEY='toss-checklist-lab-v1';const $=s=>document.querySelector(s);let tasks=[];let filter='all';
    try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(value))tasks=value.filter(t=>t&&typeof t.text==='string'&&typeof t.done==='boolean')}catch{}
    function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
    function render(){const ul=$('#tasks');ul.replaceChildren();const visible=tasks.filter(t=>filter==='all'||(filter==='active'&&!t.done)||(filter==='done'&&t.done));for(const task of visible){const li=document.createElement('li');li.className='task'+(task.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=task.done;cb.setAttribute('aria-label',task.text+' 완료');cb.onchange=()=>{task.done=cb.checked;save()};const text=document.createElement('span');text.textContent=task.text;const del=document.createElement('button');del.className='delete';del.textContent='삭제';del.onclick=()=>{tasks=tasks.filter(x=>x!==task);save()};li.append(cb,text,del);ul.append(li)}const done=tasks.filter(t=>t.done).length,remaining=tasks.length-done;$('#count').textContent=`${done} / ${tasks.length} 완료`;$('#bar').style.width=tasks.length?`${Math.round(done/tasks.length*100)}%`:'0%';$('#remaining').textContent=tasks.length===0?'할 일을 추가해 오늘을 시작해요.':remaining===0?'모두 해냈어요. 오늘도 수고했어요!':`${remaining}개의 할 일이 남았어요.`;$('#all-count').textContent=tasks.length;$('#active-count').textContent=remaining;$('#done-count').textContent=done;$('#empty').hidden=visible.length>0;$('#empty').innerHTML=tasks.length===0?'아직 항목이 없어요.<br>오늘 할 일을 하나 추가해볼까요?':filter==='active'?'남은 할 일이 없어요.<br>멋지게 마무리했네요!':'완료한 항목이 아직 없어요.'}
    $('#date').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
    $('#form').onsubmit=e=>{e.preventDefault();const text=$('#new-task').value.trim();if(!text)return;tasks.unshift({text,done:false});e.target.reset();save()};
    $('#clear').onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};
    document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()});
    $('#share').onclick=()=>{const done=tasks.filter(t=>t.done).length;$('#message').textContent=`오늘의 체크리스트 (${done}/${tasks.length} 완료)\n\n`+(tasks.length?tasks.map(t=>`${t.done?'✅':'▫️'} ${t.text}`).join('\n'):'아직 등록한 할 일이 없어요.');$('#preview').showModal();$('#status').textContent='모의 SDK가 공유 문구를 만들었어요. 실제 토스 전송은 없어요.'};
    $('#close').onclick=()=>$('#preview').close();render();
  </script>
</body>
</html>
